---
name: Backend verification report
about: Report whether Win32/Cocoa backend works for you
title: "[VERIFY] <backend> on <OS>"
labels: backend-test
body:
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - win32
        - cocoa
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "Windows 11 23H2 / macOS 14.4 Sonoma"
    validations:
      required: true

  - type: input
    id: compiler
    attributes:
      label: Compiler
      placeholder: "mingw-w64 gcc 13 / Apple clang 15"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - ✅ Works (all demos run as expected)
        - ⚠️ Partially works (some demos broken)
        - ❌ Doesn't compile
        - ❌ Compiles but crashes
        - ❌ Compiles but renders wrong
    validations:
      required: true

  - type: checkboxes
    id: demos
    attributes:
      label: Which demos did you test?
      # The four current windowed demos (make EXAMPLES_WINDOWED /
      # CMake "examples" on every backend). The old counter_x11 /
      # slider_x11-era list predated the 2025 repo restructure and
      # named binaries that no longer exist.
      options:
        - label: counter_interactive (v0.4 click/undo in a real window)
        - label: counter_perception_window (perception-driven rendering)
        - label: hover_drag_4abs (drag interaction)
        - label: a11y_orca_demo (keyboard focus + a11y query side; on Windows the screen-reader bridge is a stub — verify the Tab focus ring and Enter activation, not speech)

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any glitches, warnings, or issues you noticed
      render: shell
