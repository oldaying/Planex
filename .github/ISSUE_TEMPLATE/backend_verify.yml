---
name: Backend verification report
about: Report whether Win32/Cocoa backend works for you
title: "[VERIFY] <backend> on <OS>"
labels: backend-test
body:
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - win32
        - cocoa
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: "Windows 11 23H2 / macOS 14.4 Sonoma"
    validations:
      required: true

  - type: input
    id: compiler
    attributes:
      label: Compiler
      placeholder: "mingw-w64 gcc 13 / Apple clang 15"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - ✅ Works (all demos run as expected)
        - ⚠️ Partially works (some demos broken)
        - ❌ Doesn't compile
        - ❌ Compiles but crashes
        - ❌ Compiles but renders wrong
    validations:
      required: true

  - type: checkboxes
    id: demos
    attributes:
      label: Which demos did you test?
      options:
        - label: counter_x11
        - label: slider_x11
        - label: radio_x11
        - label: dropdown_x11
        - label: checkbox_x11
        - label: form_x11
        - label: animate_x11
        - label: resize_x11
        - label: perf_x11

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any glitches, warnings, or issues you noticed
      render: shell
