name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxft-dev libfontconfig1-dev libfreetype6-dev cmake build-essential
      - name: Build (cmake)
        run: cmake -B build && cmake --build build --config Release
      - name: Run tests
        run: |
          ./build/test_core
          ./build/test_orthogonality
          ./build/test_feedback
          ./build/test_v05_retire
          ./build/test_v06_interaction
          ./build/test_v07
          ./build/test_v08
          ./build/perception_smoke
          ./build/perception_phase2
          ./build/undo_via_graph
          ./build/antipattern_estimate
          ./build/antipattern_closure
          ./build/antipattern_perception
      - name: Run slice suites + E2 engineering leg (ADR-0025)
        # The calibration + property suites, both arms, and the
        # self-judging E2 harness — C8's registered boundaries
        # re-verify on every clean checkout.
        run: |
          ./build/test_slice_calibration
          ./build/test_slice_property
          ./build/slice_app > /dev/null
          ./build/classic_arm > /dev/null
          ./build/e2_engineering_leg
      - name: Run v5 suites + differential (ADR-0026 + ADR-0027 R2)
        # The promoted core's calibration/property/cut/seats suites
        # and the MASTER GATE: the differential against the frozen
        # slice (V1/V9 — the rewrite may extend, never alter).
        run: |
          ./build/test_v5_calibration
          ./build/test_v5_property
          ./build/test_v5_cut
          ./build/test_v5_seats
          ./build/test_v5_differential
          ./build/test_v5_mech
          ./build/test_v5_structure
          ./build/test_v5_snapshot
      - name: Run v5 client suites + golden (ADR-0028 R3)
        # The presentation client's render/hit/persistence suites
        # and the calculator demo's committed goldens — byte-
        # identical frames, both session and undo.
        run: |
          ./build/test_v5c_render
          ./build/test_v5c_hit
          ./build/test_v5c_persist
          cd build && ./if5c_calc && ./if5c_calc --undo && cd ..
          cmp build/if5c_calc_session.bmp v5/client/tests/golden/if5c_calc.golden
          cmp build/if5c_calc_undo.bmp v5/client/tests/golden/if5c_calc_undo.golden
      - name: E-series account gate (ADR-0028 F12)
        # The commissioning kit's ready-not-run account must match
        # the repository state: nine legs, five fields, zero data.
        run: bash scripts/check_e_series_runbook.sh

  linux-make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxft-dev libfontconfig1-dev libfreetype6-dev make
      - name: Build-system sync gate (Gate 13)
        # Fails fast, before the toolchain work: every examples/*.c in BOTH
        # build lists, every src/*.c referenced by both build systems. The
        # 2026-10 external audit found drift in both directions at once
        # (hover_drag_interaction Makefile-only; eight demos CMake-only;
        # actor.c/breakdown.c never in CORE_SRCS) — none visible to the
        # jobs below until link time, if ever.
        run: make check-build-sync
      - name: Build (make, headless)
        run: make BACKEND=headless
      - name: Run tests
        run: make test
      - name: Run orthogonality tests
        run: make test_ortho
      - name: Run feedback tests (v0.4)
        run: make test_feedback
      - name: Run v0.5 leak-budget retire tests (ADR-0013)
        run: make test_v05
      - name: Run v0.6 interaction prototype tests (ADR-0016)
        run: make test_v06
      - name: Run v0.7 line verification tests
        run: make test_v07
      - name: Run v0.8 line verification tests
        run: make test_v08
      - name: Run slice suites + rebound gate (ADR-0025)
        run: |
          make -C slice test
          make -C slice rebound-check
      - name: Run v5 suites + rebound gate (ADR-0026)
        # The derivation tree's suites; the rebound gate now
        # covers v5/ too (same four bans + the S15 visual-field
        # ban, with its own synthetic bite).
        run: |
          make -C v5 test
          make -C v5 rebound-check
      - name: Run v5 client suites + golden (ADR-0028 R3)
        run: |
          make -C v5/client test
          make -C v5/client golden-check
      - name: E-series account gate (ADR-0028 F12)
        run: bash scripts/check_e_series_runbook.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (cmake, warnings are errors)
        # /WX is the MSVC -Werror equivalent. The build has been
        # warning-free since f702d0a (C4244 float literals and the
        # C4996 POSIX-name nags fixed at the source level), so a new
        # warning from a future toolchain/SDK rev fails the build
        # instead of scrolling past. The old
        # -DCMAKE_EXE_LINKER_FLAGS="-lX11 ..." was copy residue from
        # the Linux config — GCC-style flags are meaningless to
        # MSVC's link.exe.
        run: cmake -B build -DCMAKE_C_FLAGS="/WX" && cmake --build build --config Release
      - name: Precheck test executables
        # A silently-unbuilt binary must fail loudly BEFORE any test
        # runs: PowerShell's call operator on a missing path does
        # not fail the step ($LASTEXITCODE keeps a stale value) —
        # the exact false-PASS shape the local pwsh loop hit during
        # the f702d0a diagnosis.
        run: |
          $tests = @('test_core','test_orthogonality','test_feedback','test_v05_retire','test_v06_interaction','test_v07','test_v08','perception_smoke','perception_phase2','undo_via_graph','test_slice_calibration','test_slice_property','test_v5_calibration','test_v5_property','test_v5_cut','test_v5_seats','test_v5_differential','test_v5_mech','test_v5_structure','test_v5_snapshot','test_v5c_render','test_v5c_hit','test_v5c_persist')
          $missing = $tests | Where-Object { -not (Test-Path ".\build\Release\${_}.exe") }
          if ($missing) {
            Write-Host "FAILED: missing test executable(s): $($missing -join ', ')"
            exit 1
          }
          Write-Host "all $($tests.Count) test executables present"
      - name: Run tests (exit code checked per suite)
        # The old one-command-per-line form had the mirror-image
        # false PASS: a failing suite mid-list left the step's exit
        # code to whatever the LAST command returned. The loop
        # records every nonzero exit and fails on any failed suite.
        # Assertions are live in Release per f702d0a's #undef NDEBUG
        # guards (Gate 4 of static-analysis.yml keeps them that way).
        run: |
          $tests = @('test_core','test_orthogonality','test_feedback','test_v05_retire','test_v06_interaction','test_v07','test_v08','perception_smoke','perception_phase2','undo_via_graph','test_slice_calibration','test_slice_property','test_v5_calibration','test_v5_property','test_v5_cut','test_v5_seats','test_v5_differential','test_v5_mech','test_v5_structure','test_v5_snapshot','test_v5c_render','test_v5c_hit','test_v5c_persist')
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "=== $t ==="
            & ".\build\Release\${t}.exe"
            if ($LASTEXITCODE -ne 0) { $failed += "${t} (exit $LASTEXITCODE)" }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAILED suites: $($failed -join '; ')"
            exit 1
          }
          Write-Host "all $($tests.Count) suites passed (assertions live)"
          Write-Host "=== slice arms + E2 engineering leg (ADR-0025) ==="
          # Precheck first: a missing binary must fail loudly BEFORE
          # any invocation (PowerShell's call operator on a missing
          # path does not fail the step — the false-PASS shape the
          # precheck step above exists to prevent).
          $sliceBins = @('slice_app','classic_arm','e2_engineering_leg')
          $missing = $sliceBins | Where-Object { -not (Test-Path ".\build\Release\${_}.exe") }
          if ($missing) {
            Write-Host "FAILED: missing slice executable(s): $($missing -join ', ')"
            exit 1
          }
          & ".\build\Release\slice_app.exe" > $null
          if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: slice_app (exit $LASTEXITCODE)"; exit 1 }
          & ".\build\Release\classic_arm.exe" > $null
          if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: classic_arm (exit $LASTEXITCODE)"; exit 1 }
          & ".\build\Release\e2_engineering_leg.exe"
          if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: e2_engineering_leg (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "slice arms + E2 leg passed"

  strict-warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libfreetype6-dev libfontconfig1-dev make
      - name: Build-system sync gate (Gate 13)
        run: make check-build-sync
      - name: Build with -Werror
        run: make BACKEND=headless CFLAGS_EXTRA="-Werror"
      - name: Run tests
        run: make test
      - name: Run orthogonality tests
        run: make test_ortho
      - name: Run feedback tests (v0.4)
        run: make test_feedback
      - name: Run v0.5 leak-budget retire tests (ADR-0013)
        run: make test_v05
      - name: Run v0.6 interaction prototype tests (ADR-0016)
        run: make test_v06
      - name: Run v0.7 line verification tests
        run: make test_v07
      - name: Run v0.8 line verification tests
        run: make test_v08
      - name: Run slice suites + rebound gate under -Werror (ADR-0025)
        run: |
          make -C slice test
          make -C slice rebound-check
      - name: Run v5 + client under -Werror (ADR-0026/0028)
        # The derivation tree and its client build with the strict
        # family too; the new R3 sources additionally pass the
        # -Wconversion -Wsign-conversion -Wshadow battery the R1/R2
        # sources were held to.
        run: |
          make -C v5 test CFLAGS_EXTRA="-Werror"
          make -C v5/client test CFLAGS_EXTRA="-Werror"
          cc -std=c17 -Wall -Wextra -Wpedantic -Werror -Wconversion -Wsign-conversion -Wshadow \
             -Iv5/include -Iv5/src -c v5/src/if5_snapshot.c -o /tmp/conv1.o
          cc -std=c17 -Wall -Wextra -Wpedantic -Werror -Wconversion -Wsign-conversion -Wshadow \
             -Iv5/client/include -Iv5/client/src -Iv5/include -c v5/client/src/if5c_fb.c -o /tmp/conv2.o
          cc -std=c17 -Wall -Wextra -Wpedantic -Werror -Wconversion -Wsign-conversion -Wshadow \
             -Iv5/client/include -Iv5/client/src -Iv5/include -c v5/client/src/if5c_layout.c -o /tmp/conv3.o
          cc -std=c17 -Wall -Wextra -Wpedantic -Werror -Wconversion -Wsign-conversion -Wshadow \
             -Iv5/client/include -Iv5/client/src -Iv5/include -c v5/client/src/if5c_ease.c -o /tmp/conv4.o

  a11y-atspi-bridge:
    # v0.7 Line 4: compile-probe the AT-SPI2 adapter against real atk
    # headers. A PROBE, not a gate for the condition: if the headers
    # are absent the step reports "condition unmet" and exits 0 (the
    # ledger row stays partial per v0.7-roadmap Line 4); if they are
    # present, the compile MUST pass (API drift is a real failure).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install atk headers
        # Ubuntu 24.04 (noble) removed the at-spi2-atk package: ATK and
        # the bridge were folded into at-spi2-core. The split dev
        # packages are libatk1.0-dev (atk/*.h) and libatk-bridge2.0-dev
        # (the atk-bridge.h header, at a distro-dependent path) — both
        # are needed for the probe to compile the adapter against real
        # headers.
        run: sudo apt-get update && sudo apt-get install -y libatk1.0-dev libatk-bridge2.0-dev
      - name: Compile-probe the AT-SPI2 bridge
        run: |
          set -eu
          # The bridge header's on-disk layout is distro-dependent
          # (jammy: /usr/include/atk-bridge-2.0/, noble:
          # /usr/include/at-spi2-atk/2.0/) — pkg-config is the only
          # reliable resolver, so the probe gates on the pkg-config
          # entries rather than hard-coded paths. The source includes
          # <atk-bridge.h> bare for the same reason.
          if ! pkg-config --exists atk; then
            echo "condition unmet: atk dev absent — bridge ships behind the flag; ledger row stays partial"
            exit 0
          fi
          if ! pkg-config --exists atk-bridge-2.0; then
            echo "condition unmet: atk-bridge-2.0 dev absent — bridge ships behind the flag; ledger row stays partial"
            exit 0
          fi
          echo "probing bridge against real atk headers: $(pkg-config --cflags atk atk-bridge-2.0)"
          cc -std=c17 -Wall -Wextra -I include $(pkg-config --cflags atk atk-bridge-2.0) -DPX_A11Y_ATSPI \
             -c src/a11y_bridge_atspi.c -o /tmp/a11y_bridge_atspi.o
          echo "bridge compile probe: PASS"
