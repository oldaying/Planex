name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxft-dev libfontconfig1-dev libfreetype6-dev cmake build-essential
      - name: Build (cmake)
        run: cmake -B build && cmake --build build --config Release
      - name: Run tests
        run: |
          ./build/test_core
          ./build/test_orthogonality
          ./build/test_feedback
          ./build/test_v05_retire
          ./build/test_v06_interaction
          ./build/test_v07
          ./build/perception_smoke
          ./build/perception_phase2
          ./build/undo_via_graph
          ./build/antipattern_estimate
          ./build/antipattern_closure
          ./build/antipattern_perception

  linux-make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxft-dev libfontconfig1-dev libfreetype6-dev make
      - name: Build (make, headless)
        run: make BACKEND=headless
      - name: Run tests
        run: make test
      - name: Run orthogonality tests
        run: make test_ortho
      - name: Run feedback tests (v0.4)
        run: make test_feedback
      - name: Run v0.5 leak-budget retire tests (ADR-0013)
        run: make test_v05
      - name: Run v0.6 interaction prototype tests (ADR-0016)
        run: make test_v06
      - name: Run v0.7 line verification tests
        run: make test_v07

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (cmake)
        run: cmake -B build -DCMAKE_EXE_LINKER_FLAGS="-lX11 -lXext -lfreetype -lfontconfig" && cmake --build build --config Release
      - name: Run tests
        run: |
          .\build\Release\test_core.exe
          .\build\Release\test_orthogonality.exe
          .\build\Release\test_feedback.exe
          .\build\Release\test_v05_retire.exe
          .\build\Release\test_v06_interaction.exe
          .\build\Release\test_v07.exe
          .\build\Release\perception_smoke.exe
          .\build\Release\perception_phase2.exe
          .\build\Release\undo_via_graph.exe

  strict-warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libfreetype6-dev libfontconfig1-dev make
      - name: Build with -Werror
        run: make BACKEND=headless CFLAGS_EXTRA="-Werror"
      - name: Run tests
        run: make test
      - name: Run orthogonality tests
        run: make test_ortho
      - name: Run feedback tests (v0.4)
        run: make test_feedback
      - name: Run v0.5 leak-budget retire tests (ADR-0013)
        run: make test_v05
      - name: Run v0.6 interaction prototype tests (ADR-0016)
        run: make test_v06
      - name: Run v0.7 line verification tests
        run: make test_v07

  a11y-atspi-bridge:
    # v0.7 Line 4: compile-probe the AT-SPI2 adapter against real atk
    # headers. A PROBE, not a gate for the condition: if the headers
    # are absent the step reports "condition unmet" and exits 0 (the
    # ledger row stays partial per v0.7-roadmap Line 4); if they are
    # present, the compile MUST pass (API drift is a real failure).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install atk headers
        # Ubuntu 24.04 (noble) removed the at-spi2-atk package: ATK and
        # the bridge were folded into at-spi2-core. The split dev
        # packages are libatk1.0-dev (atk/*.h) and libatk-bridge2.0-dev
        # (atk-bridge-2.0/atk-bridge.h) — both are needed for the probe
        # to compile the adapter against real headers.
        run: sudo apt-get update && sudo apt-get install -y libatk1.0-dev libatk-bridge2.0-dev
      - name: Compile-probe the AT-SPI2 bridge
        run: |
          set -eu
          if [ ! -f /usr/include/atk-1.0/atk/atk.h ] && ! pkg-config --exists atk; then
            echo "condition unmet: atk headers absent — bridge ships behind the flag; ledger row stays partial"
            exit 0
          fi
          BRIDGE_HDR=""
          for h in /usr/include/atk-bridge-2.0/atk-bridge.h /usr/include/at-spi2/atk-bridge/atk-bridge.h; do
            if [ -f "$h" ]; then BRIDGE_HDR="$h"; fi
          done
          if [ -z "$BRIDGE_HDR" ]; then
            echo "condition unmet: atk-bridge headers absent — bridge ships behind the flag; ledger row stays partial"
            exit 0
          fi
          CFLAGS_ATK="$(pkg-config --cflags atk 2>/dev/null || echo -I/usr/include/atk-1.0)"
          echo "probing bridge against $BRIDGE_HDR with $CFLAGS_ATK"
          cc -std=c17 -Wall -Wextra -I include $CFLAGS_ATK -DPX_A11Y_ATSPI \
             -c src/a11y_bridge_atspi.c -o /tmp/a11y_bridge_atspi.o
          echo "bridge compile probe: PASS"
