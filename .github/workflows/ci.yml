name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxft-dev libfontconfig1-dev libfreetype6-dev cmake build-essential
      - name: Build (cmake)
        run: cmake -B build && cmake --build build --config Release
      - name: Run tests
        run: |
          ./build/test_core
          ./build/test_orthogonality
          ./build/test_feedback
          ./build/test_v05_retire
          ./build/test_v06_interaction
          ./build/test_v07
          ./build/test_v08
          ./build/perception_smoke
          ./build/perception_phase2
          ./build/undo_via_graph
          ./build/antipattern_estimate
          ./build/antipattern_closure
          ./build/antipattern_perception

  linux-make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxft-dev libfontconfig1-dev libfreetype6-dev make
      - name: Build (make, headless)
        run: make BACKEND=headless
      - name: Run tests
        run: make test
      - name: Run orthogonality tests
        run: make test_ortho
      - name: Run feedback tests (v0.4)
        run: make test_feedback
      - name: Run v0.5 leak-budget retire tests (ADR-0013)
        run: make test_v05
      - name: Run v0.6 interaction prototype tests (ADR-0016)
        run: make test_v06
      - name: Run v0.7 line verification tests
        run: make test_v07
      - name: Run v0.8 line verification tests
        run: make test_v08

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (cmake, warnings are errors)
        # /WX is the MSVC -Werror equivalent. The build has been
        # warning-free since f702d0a (C4244 float literals and the
        # C4996 POSIX-name nags fixed at the source level), so a new
        # warning from a future toolchain/SDK rev fails the build
        # instead of scrolling past. The old
        # -DCMAKE_EXE_LINKER_FLAGS="-lX11 ..." was copy residue from
        # the Linux config — GCC-style flags are meaningless to
        # MSVC's link.exe.
        run: cmake -B build -DCMAKE_C_FLAGS="/WX" && cmake --build build --config Release
      - name: Precheck test executables
        # A silently-unbuilt binary must fail loudly BEFORE any test
        # runs: PowerShell's call operator on a missing path does
        # not fail the step ($LASTEXITCODE keeps a stale value) —
        # the exact false-PASS shape the local pwsh loop hit during
        # the f702d0a diagnosis.
        run: |
          $tests = @('test_core','test_orthogonality','test_feedback','test_v05_retire','test_v06_interaction','test_v07','test_v08','perception_smoke','perception_phase2','undo_via_graph')
          $missing = $tests | Where-Object { -not (Test-Path ".\build\Release\${_}.exe") }
          if ($missing) {
            Write-Host "FAILED: missing test executable(s): $($missing -join ', ')"
            exit 1
          }
          Write-Host "all $($tests.Count) test executables present"
      - name: Run tests (exit code checked per suite)
        # The old one-command-per-line form had the mirror-image
        # false PASS: a failing suite mid-list left the step's exit
        # code to whatever the LAST command returned. The loop
        # records every nonzero exit and fails on any failed suite.
        # Assertions are live in Release per f702d0a's #undef NDEBUG
        # guards (Gate 4 of static-analysis.yml keeps them that way).
        run: |
          $tests = @('test_core','test_orthogonality','test_feedback','test_v05_retire','test_v06_interaction','test_v07','test_v08','perception_smoke','perception_phase2','undo_via_graph')
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "=== $t ==="
            & ".\build\Release\${t}.exe"
            if ($LASTEXITCODE -ne 0) { $failed += "${t} (exit $LASTEXITCODE)" }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAILED suites: $($failed -join '; ')"
            exit 1
          }
          Write-Host "all $($tests.Count) suites passed (assertions live)"

  strict-warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libfreetype6-dev libfontconfig1-dev make
      - name: Build with -Werror
        run: make BACKEND=headless CFLAGS_EXTRA="-Werror"
      - name: Run tests
        run: make test
      - name: Run orthogonality tests
        run: make test_ortho
      - name: Run feedback tests (v0.4)
        run: make test_feedback
      - name: Run v0.5 leak-budget retire tests (ADR-0013)
        run: make test_v05
      - name: Run v0.6 interaction prototype tests (ADR-0016)
        run: make test_v06
      - name: Run v0.7 line verification tests
        run: make test_v07
      - name: Run v0.8 line verification tests
        run: make test_v08

  a11y-atspi-bridge:
    # v0.7 Line 4: compile-probe the AT-SPI2 adapter against real atk
    # headers. A PROBE, not a gate for the condition: if the headers
    # are absent the step reports "condition unmet" and exits 0 (the
    # ledger row stays partial per v0.7-roadmap Line 4); if they are
    # present, the compile MUST pass (API drift is a real failure).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install atk headers
        # Ubuntu 24.04 (noble) removed the at-spi2-atk package: ATK and
        # the bridge were folded into at-spi2-core. The split dev
        # packages are libatk1.0-dev (atk/*.h) and libatk-bridge2.0-dev
        # (the atk-bridge.h header, at a distro-dependent path) — both
        # are needed for the probe to compile the adapter against real
        # headers.
        run: sudo apt-get update && sudo apt-get install -y libatk1.0-dev libatk-bridge2.0-dev
      - name: Compile-probe the AT-SPI2 bridge
        run: |
          set -eu
          # The bridge header's on-disk layout is distro-dependent
          # (jammy: /usr/include/atk-bridge-2.0/, noble:
          # /usr/include/at-spi2-atk/2.0/) — pkg-config is the only
          # reliable resolver, so the probe gates on the pkg-config
          # entries rather than hard-coded paths. The source includes
          # <atk-bridge.h> bare for the same reason.
          if ! pkg-config --exists atk; then
            echo "condition unmet: atk dev absent — bridge ships behind the flag; ledger row stays partial"
            exit 0
          fi
          if ! pkg-config --exists atk-bridge-2.0; then
            echo "condition unmet: atk-bridge-2.0 dev absent — bridge ships behind the flag; ledger row stays partial"
            exit 0
          fi
          echo "probing bridge against real atk headers: $(pkg-config --cflags atk atk-bridge-2.0)"
          cc -std=c17 -Wall -Wextra -I include $(pkg-config --cflags atk atk-bridge-2.0) -DPX_A11Y_ATSPI \
             -c src/a11y_bridge_atspi.c -o /tmp/a11y_bridge_atspi.o
          echo "bridge compile probe: PASS"
