name: Docs

# Doc-organization contract enforcers (6 gates from doc-organization.md
# Part VI + 1 completeness gate landed in commit f7fc630 + 2 more gates
# landed in commit 98295cc + 1 essence-admission gate landed in T7 +
# 1 stale-abstraction-count gate landed in T8).
# These run alongside .github/workflows/ci.yml (the code build). The two
# workflows are independent: a green Docs check does NOT imply the code
# builds.
#
# Closed deferrals (see doc-organization.md Part IX deferral table):
#   - "Wire check_doc_sections.sh into CI" (Principle 11)
#   - "Wire REVIEW-RUBRIC.md into PR template" (Principle 12) -- see
#     .github/PULL_REQUEST_TEMPLATE.md (a separate file, not a CI gate;
#     the rubric is human-applied at PR review time, not CI-scored).
#
# The 11 gates are: 7 shell scripts (check_doc_sections, check_adr_lifecycle,
# gen_adr_index, check_links, find_orphans, check_terms, check_stale_abstraction_count)
# + 4 make targets (check-completeness, check-compression, check-examples,
# check-essence). All 11 are wired across 5 jobs. Each gate is its own step
# so the GitHub UI shows which contract broke.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/test_completeness.c'
      - 'tests/synthetic_adr_0015.md'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/test_completeness.c'
      - 'tests/synthetic_adr_0015.md'
      - 'Makefile'
      - '.github/workflows/docs.yml'

jobs:
  doc-org-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Gate 1: Every ADR has all 9 mandatory sections.
      # Closes the docBlame-style "is the heading present?" contract.
      # Research basis: Mathlib's docBlame linter.
      # ------------------------------------------------------------------
      - name: check_doc_sections (ADR section completeness, 9 mandatory)
        run: scripts/check_doc_sections.sh --check

      # ------------------------------------------------------------------
      # Gate 2: ADR directory state matches the Status field in the file.
      # Closes the "lifecycle is invisible in the filesystem" gap
      # (doc-organization.md Principle 1, seL4's lifecycle-as-directory).
      # ------------------------------------------------------------------
      - name: check_adr_lifecycle (ADR dir state matches Status field)
        run: scripts/check_adr_lifecycle.sh --check

      # ------------------------------------------------------------------
      # Gate 3: ADR index in decisions/README.md is up to date.
      # Closes the "hand-maintained index can drift from ADR set" gap
      # (doc-organization.md Principle 8, Nygard's auto-generated ADR 1).
      # ------------------------------------------------------------------
      - name: gen_adr_index (auto-generated ADR index matches committed)
        run: scripts/gen_adr_index.sh --check

      # ------------------------------------------------------------------
      # Gate 4: All internal markdown links resolve to existing files.
      # Closes the "broken links hide silently" gap. The script auto-strips
      # inline code spans so links inside backticks don't false-positive.
      # ------------------------------------------------------------------
      - name: check_links (all internal markdown links resolve)
        run: scripts/check_links.sh --check

      # ------------------------------------------------------------------
      # Gate 5: No unreferenced doc files (staging/changelog/README
      # whitelisted). Closes the "orphan drift" gap where a doc can
      # be added but never linked into the docs graph.
      # ------------------------------------------------------------------
      - name: find_orphans (no unreferenced docs)
        run: scripts/find_orphans.sh --check

      # ------------------------------------------------------------------
      # Gate 6: Every glossary term used in canonical/ is linked to
      # glossary.md. Closes the "terms float without saturation" gap
      # (doc-organization.md Principle 3, Lean 4 module docstring rule).
      # ------------------------------------------------------------------
      - name: check_terms (glossary term saturation)
        run: scripts/check_terms.sh --check

      # ------------------------------------------------------------------
      # Gate 8: No stale 4-abstraction references in v0.5-current docs.
      # Closes the gap surfaced in commit aa752e7 (docs(spec): refresh
      # stale 4-abstraction references) by making CONTRIBUTING.md rule
      # 5's manual grep self-enforcing. Post-ADR-0008 (v0.4, added
      # px_loop as 5th abstraction), any v0.5-current doc still saying
      # "4 abstractions" or listing "Relation + Estimate + Closure +
      # Perception" without px_loop is stale. Historical files (ADRs,
      # changelog, research, v0.4 snapshots) are exempt; intentional
      # historical quotations can be marked inline with
      # <!-- stale-allow: reason -->.
      # ------------------------------------------------------------------
      - name: check_stale_abstraction_count (no stale 4-abstraction refs)
        run: scripts/check_stale_abstraction_count.sh --check

  completeness-corpus:
    # Separate job from doc-org-contract because it needs the C toolchain
    # to build tests/test_completeness.c. The 6 doc-org gates above are
    # pure shell; this one compiles and runs a C test binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y make build-essential
      - name: Build and run completeness corpus test (68 patterns x 4 invariants)
        run: make BACKEND=headless check-completeness

  compression-metric:
    # The 9th gate: Planex Compression Metric (PCM) v0.1.
    # Closes the last engineering-mechanism gap in abstraction-form.md
    # Prerequisite 3. Pure shell + awk; needs no compiler, but runs in
    # its own job for clean CI signal isolation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install awk
        run: sudo apt-get update && sudo apt-get install -y gawk
      - name: Run compression metric (AEL per example + aggregate LLE)
        run: make check-compression

  examples-regression:
    # The 10th gate: Wave 4.3 from doc-organization.md (Principle 7).
    # Each examples/X.c paired with examples/X.expected; CI runs each
    # example, diffs stdout+stderr against expected, fails on drift.
    # Timestamps and addresses are normalized before diffing so
    # non-deterministic output (px_now_ms() in log perceptions) does
    # not false-positive. Closes the "examples can drift silently" gap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y make build-essential libfreetype6-dev libfontconfig1-dev
      - name: Build examples (headless)
        run: make BACKEND=headless examples
      - name: Run examples-as-regression-tests (diff against .expected)
        run: make BACKEND=headless check-examples

  essence-admission:
    # The 11th gate: ADR-0014's essence-justified admission enforcement.
    # Runs scripts/check_essence_admission.sh in two modes:
    #   --check     -> scans docs/decisions/{proposed,validated}/ for
    #                  ADRs with `## Essence Check` sections; verifies
    #                  each passes the 3 admission criteria (tradition
    #                  cite + real alternatives + negative consequences).
    #   --synthetic -> runs on tests/synthetic_adr_0015.md (the
    #                  synthetic violation case from ADR-0014's
    #                  `## Validation` section); expects non-zero exit
    #                  as the falsifiability demonstration that the
    #                  lint correctly fires on a tradition-less
    #                  essence-justified claim.
    # Closes the "essence-justified criterion documented but not enforced"
    # gap from ADR-0011's Known issues + doc-organization.md Part IX.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y make build-essential
      - name: Essence-justified admission check (real ADRs + synthetic case)
        run: make check-essence
